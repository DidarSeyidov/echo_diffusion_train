# EchoDiffusion -- audio-only trajectory diffusion (the default starting point).
#
# Conditioning: Bayesian sound BEV field + raw ODAS DoA tokens + ego state.
# No camera: nothing here imports timm or allocates a ViT.

seed: 42

paths:
  # Episodes produced by scripts/prepare_dataset.py.
  train_dir: data/episodes/train
  val_dir: data/episodes/val
  output_dir: checkpoints/audio_only

# ── which pose stream supervises the trajectory ──────────────────────────
# "odometry" | "vicon" | "auto"  (auto prefers vicon, falls back to odometry).
# Episodes store both streams, so this is a re-train, not a re-prepare.
poses:
  source: auto
  fallback: true          # allow the other stream when the requested one is absent

# ── microphone array extrinsics ──────────────────────────────────────────
# Rotation from the ODAS array frame into the robot base frame (x fwd, y left,
# z up).  Identity = array mounted flat with its x axis pointing forward.
# Run scripts/calibrate_array.py against a recording with a known source
# bearing to solve for azimuth_offset_deg.
array:
  rotation_rpy_deg: [0.0, 0.0, 0.0]
  translation: [0.0, 0.0, 0.0]
  azimuth_offset_deg: 0.0
  flip_azimuth: false

# ── Bayesian sound-direction BEV field ───────────────────────────────────
bev:
  range_m: 6.0              # grid covers +/- range_m in x and y  -> 80x80 cells
  resolution: 0.15
  kappa_min: 4.0            # von Mises concentration at zero confidence
  kappa_max: 40.0           # ... and at full confidence
  p_hit: 0.60               # inverse sensor model, on the ray axis
  p_miss: 0.48              # ... and far off-axis
  l_max: 15.0
  decay_half_life_s: 6.0    # evidence half-life: the triangulation baseline
  min_range: 0.25
  min_weight: 0.05          # ignore detections below this SSL energy / SST activity
  # Drop near-vertical DoAs: azimuth is degenerate there, and ODAS parks
  # phantom/reflection tracks near the zenith.  Measured on session_01 (real
  # source at 47-78 deg elevation, phantom track at 78-90 deg): at 89 deg the
  # median bearing error is 1.0 deg but the worst case is 107 deg; anywhere in
  # 75-80 deg the worst case is 1.8 deg.  Re-check this on a new rig.
  max_elevation_deg: 78.0
  history_len: 4            # instantaneous ray maps stacked with the posterior
  readout_temperature: 0.5

data:
  horizon: 20               # predicted waypoints -- 2.0 s @ 10 Hz
  warmup: 30                # filter roll-forward steps before each anchor
  past_len: 10
  stride: 1
  use_ssl: true
  use_sst: true
  max_doa_tokens: 8
  doa_frames: 4
  min_sst_activity: 0.1     # dormant SST tracks hold a stale bearing
  traj_scale: auto          # metres per normalised unit; "auto" fits from data
  goal_scale: 8.0
  use_image: false
  val_fraction: 0.2         # only used when paths.episode_dir is set instead

model:
  traj_dim: 2               # (x, y) in the robot frame
  cond_dim: 256
  predict_source: true      # auxiliary head regressing the GT source position
  cond_dropout: 0.0         # >0 enables classifier-free guidance
  guidance_scale: 1.0
  encoders:
    bev_dim: 256
    bev_widths: [32, 64, 128]
    bev_pool: 4
    doa_token_dim: 128
    doa_dim: 128
    ego_dim: 64
    dropout: 0.0
  unet:
    down_dims: [128, 256, 512]   # horizon must be divisible by 2^(len-1)
    kernel_size: 5
    n_groups: 8
    step_embed_dim: 128

diffusion:
  num_timesteps: 100
  beta_schedule: cosine
  prediction_type: epsilon       # "epsilon" | "sample"
  clip_sample: true
  clip_range: 1.5
  num_inference_steps: 16
  ddim_eta: 0.0                  # 0 = deterministic; >0 samples multiple paths

training:
  num_epochs: 200
  batch_size: 64
  num_workers: 8
  learning_rate: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  warmup_steps: 500
  grad_clip: 1.0
  amp: true
  use_ema: true
  ema_decay: 0.999
  source_loss_weight: 0.1
  log_every: 20
  val_every: 1
  # Log the trajectory-vs-DoA figure at every validation: it is the main
  # qualitative signal and costs one matplotlib render per epoch.
  viz_every: 1
  save_every: 10

logging:
  use_comet: true
  comet_project: echodiffusion
  comet_workspace: iana-zhura
  # Left null on purpose: this file is tracked by git, so the key lives in
  # ~/.comet.config (or COMET_API_KEY). Resolution order is
  # config -> COMET_API_KEY -> ~/.comet.config.
  comet_api_key: null
